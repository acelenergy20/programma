<title>ΟΜΣΙΕ 2017–2025 · Χρονολόγιο</title>
<style>
:root{--bg:#eef9f8;--ink:#2a2622;--mut:#7a7066;--line:#b8e0dc;--gold:#0e7c7b;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#17a2a2,#0e7c7b);color:#fff;padding:14px 20px;box-shadow:0 2px 8px #0003}
header h1{margin:0;font-size:20px;font-weight:normal;letter-spacing:.3px}header h1 b{color:#fff3c4;font-weight:normal}
.note{font:12px system-ui,sans-serif;color:#e3fbf8;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font:13px system-ui,sans-serif}
.bar input{flex:1;min-width:180px;padding:6px 10px;border-radius:6px;border:0}
.bar input[type=checkbox]{flex:0;min-width:0;margin-right:4px}
.chip{padding:4px 11px;border-radius:14px;border:0;cursor:pointer;color:#fff;font:13px system-ui,sans-serif;margin:0 4px 4px 0}.chip.big{font-size:14.5px;padding:7px 14px;border-radius:18px}.chip.big:first-child{color:#0b4f4e}#subs:empty{display:none}
.chip.on{background:#e0bf6e;color:#2f2a25;border-color:#e0bf6e}
.years{display:flex;gap:4px;overflow:auto;padding:8px 20px;background:#d4f1ee;border-bottom:1px solid var(--line);font:13px system-ui,sans-serif;position:sticky;top:0}
.years a{padding:3px 10px;border-radius:4px;color:var(--ink);text-decoration:none}.years a:hover{background:#fff}
main{max-width:1000px;margin:0 auto;padding:10px 20px 80px}
.yr{margin-top:34px}.yr>h2{font-size:30px;font-weight:normal;color:var(--gold);margin:0 0 4px;border-bottom:1px solid var(--line)}
.ysum{font:12px system-ui,sans-serif;color:var(--mut);margin-bottom:12px}
.tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.ev:before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,#999);border:2px solid var(--bg)}
.ev .d{font:12px system-ui,sans-serif;color:var(--mut)}.ev .s{font:11px system-ui,sans-serif;color:#fff;background:var(--c,#999);padding:1px 7px;border-radius:9px;margin-left:6px}
.ev .t{font-size:16px;margin:4px 0}.ev .meta{font:12.5px system-ui,sans-serif;color:#4c443d}
.ev .st{float:right;font:11px system-ui,sans-serif;padding:2px 8px;border-radius:9px;background:#eee}
.st.ok{background:#dcefd9}.st.part{background:#f6ecc9}.st.no{background:#f4d6d2}.st.pr{background:#dbe6f5}
details{margin-top:8px;font:13px system-ui,sans-serif}summary{cursor:pointer;color:var(--gold)}
ul{margin:6px 0 0;padding-left:18px}li{margin:3px 0}a{color:#0b6665}
.mail{background:#f7fdfc;border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:14px 0}
.mail h3{margin:0;font:600 13px system-ui,sans-serif}.th{font:600 12px system-ui,sans-serif;margin-top:8px;color:#5a5047}
.hide{display:none}.att{color:var(--mut)}
.vols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.vol{background:linear-gradient(135deg,#17a2a2,#0e7c7b);color:#fff;border-radius:8px;padding:14px}.vol b{color:#fff3c4;display:block;font-weight:normal;font-size:17px}
.vol span{font:12px system-ui,sans-serif;color:#e3fbf8}
.ev.hl{background:#fff9e6;box-shadow:0 0 0 3px #f2c94c55}.ev.hl .t{font-weight:bold;font-size:17px}

#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#17a2a2,#0e7c7b)}
#gate form{background:#fff;padding:28px 30px;border-radius:12px;max-width:360px;width:90%;box-shadow:0 8px 30px #0004;font:15px system-ui,sans-serif;text-align:center}
#gate h2{margin:0 0 6px;font:22px Georgia,serif;color:#0e7c7b}#gate p{color:#555;margin:0 0 16px}
#gate input{width:100%;padding:10px;border:1px solid #b8e0dc;border-radius:8px;font-size:16px;margin-bottom:12px}
#gate button{background:#0e7c7b;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
#gerr{color:#c0392b;min-height:18px;margin-top:8px}
.ev.hl{background:#fff9e6;box-shadow:0 0 0 3px #f2c94c55}.ev.hl .t{font-weight:bold;font-size:17px}
.addbtn{display:inline-block;margin-left:10px;background:#fff3c4;color:#0b4f4e;border-radius:14px;padding:3px 12px;font:13px system-ui,sans-serif;text-decoration:none}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));return JSON.parse(new TextDecoder().decode(pt));}
let D,COL,PIL,SP,sel,solo=null,pil=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yOf=e=>+e.k.slice(0,4);
function start(x){D=x;COL=x.COL;PIL=x.PIL;SP=x.SP;sel=new Set(Object.keys(COL));document.getElementById('gate').remove();paintChips();draw();
 document.getElementById('q').oninput=draw;document.getElementById('exp').onchange=draw;}
document.getElementById('gf').onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById('pw').value.trim();
 try{const x=await unlock(pw);try{sessionStorage.setItem('xk',pw)}catch(e){}start(x)}catch(e){document.getElementById('gerr').textContent='Λάθος κωδικός'}};
(async()=>{let k=null;try{k=sessionStorage.getItem('xk')}catch(e){}if(k){try{start(await unlock(k))}catch(e){}}})();
const chips=document.getElementById('chips'),subs=document.getElementById('subs');
function setSel(){sel=new Set(Object.keys(COL).filter(s=>(pil===null||SP[s]===pil)&&(solo===null||s===solo)));}
function paintChips(){chips.innerHTML='';subs.innerHTML='';
 const mk=(el,lab,c,on,dim,fn,cls)=>{const b=document.createElement('button');b.className=cls;b.textContent=lab;b.style.background=c;b.style.opacity=dim?'.32':'1';if(on){b.style.boxShadow='0 0 0 2px #fff inset';b.style.fontWeight='700'}b.onclick=fn;el.appendChild(b)};
 mk(chips,'Όλα','#f2c94c',pil===null,false,()=>{pil=null;solo=null;setSel();paintChips();draw()},'chip big');
 for(const [k,[n,c]] of Object.entries(PIL)){const cnt=D.ev.filter(e=>e.p===k).length;if(!cnt)continue;
  mk(chips,`${k}. ${n} (${cnt})`,c,pil===k,pil!==null&&pil!==k,()=>{pil=(pil===k&&solo===null)?null:k;solo=null;setSel();paintChips();draw()},'chip big');}
 for(const s of Object.keys(COL)){const cnt=D.ev.filter(e=>e.s===s).length;if(!cnt)continue;
  mk(subs,`${s} (${cnt})`,COL[s],solo===s,pil===null||SP[s]!==pil||(solo!==null&&solo!==s),()=>{if(solo===s){solo=null;}else{solo=s;pil=SP[s];}setSel();paintChips();draw()},'chip');}}
function draw(){const q=document.getElementById('q').value.toLowerCase();
 const years=[...new Set(D.ev.map(yOf))].sort();let h='',nav='';
 for(const y of years){const evs=D.ev.filter(e=>yOf(e)==y&&sel.has(e.s)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));
  if(!evs.length)continue;nav+=`<a href="#y${y}">${y}</a>`;
  h+=`<section class="yr" id="y${y}"><h2>${y}</h2><div class="ysum">${evs.length} γεγονότα</div><div class="tl">`;
  for(const e of evs){const c=COL[e.s]||'#999';
   h+=`<div class="ev${e.hl?' hl':''}" style="--c:${c};border:${e.hl?4:2}px solid ${e.hl?'#d4a017':c}"><span class="d">${esc(e.d)}</span><span class="s">${esc(PIL[e.p][0])} › ${esc(e.s)}</span><div class="t">${esc(e.t)}</div>`;
   if(e.press.length)h+=`<details><summary>Δημοσιεύματα & τεκμήρια (${e.press.length})</summary><ul>${e.press.map(p=>`<li>${esc(p.d)} · <a href="${esc(p.u)}" target="_blank" rel="noopener">${esc(p.m)}: ${esc(p.t)}</a></li>`).join('')}</ul></details>`;
   h+='</div>';}
  h+='</div></section>';}
 if(pil===null)h+=`<section class="yr"><h2>Οι τόμοι</h2><div class="ysum">Η συνολική αποτύπωση της οκταετίας</div><div class="vols">
 <div class="vol"><b>ΨΑΛΤΙΚΗ 2.01</b><span>Πρακτικά Συνεδρίου 2018 · Παλαιά Βουλή</span></div>
 <div class="vol"><b>ΨΑΛΤΙΚΗ 2.02</b><span>Πρακτικά Συνεδρίου Τρικάλων 2021</span></div>
 <div class="vol"><b>ΨΑΛΤΙΚΗ 2.03</b><span>Προσυνέδρια Αργολίδας · Ορεστιάδας · Βόλου · Συνέδριο Αθήνας 2025</span></div>
 <div class="vol"><b>Λεύκωμα</b><span>«ΨΑΛΤΙΚΗ, Η ΠΡΟΣΦΥΞ ΕΛΛΗΝΙΣ»</span></div></div></section>`;
 document.getElementById('m').innerHTML=h;document.getElementById('years').innerHTML=nav;
 if(document.getElementById('exp').checked)document.querySelectorAll('#m details').forEach(d=>d.open=true);}
</script></body></html>
